<meta name="apple-mobile-web-app-title" content="Saham US">
<title>Saham US</title>
<style>
:root{color-scheme:dark;--bg:#04080a;--panel:#0b1317;--line:#1d2b32;--txt:#f2f6f7;--mut:#8b9ba3;--g:#22e07a;--r:#ff4d4d;--p:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top)) 4px max(6px,env(safe-area-inset-bottom))}
header{padding:0 6px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;flex:none;border-radius:50%}
.ttl{flex:1;min-width:0}
h1{font-size:19px;line-height:1.1;font-weight:800;letter-spacing:-.3px}
h1 b{color:var(--g)}
.sub{font-size:10.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#live{flex:none;display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:11px;line-height:1.2;color:#cfe0e6;cursor:pointer;max-width:130px}
#live i{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);flex:none}
#live.err i{background:var(--p);box-shadow:0 0 8px var(--p)}
#live.load i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.stats{padding:0 4px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:5px}
.card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:5px 7px;display:flex;align-items:center;gap:6px;min-width:0}
.card svg{width:18px;height:18px;flex:none}
.card .v{font-size:13px;font-weight:800;line-height:1.1;white-space:nowrap}
.card .l{font-size:9px;color:var(--mut);margin-top:2px;white-space:nowrap}
.up{color:var(--g)}.dn{color:var(--r)}.nu{color:var(--p)}
.fg{padding:0 8px;display:flex;align-items:center;gap:10px}
.fgb{flex:none;width:50%;height:7px;border-radius:6px;overflow:hidden;display:flex;gap:2px;background:#16262d}
.fgb i{display:block;height:100%;width:50%;transition:width .9s cubic-bezier(.4,0,.2,1),background .6s}
#fgR{background:var(--r);border-radius:6px 2px 2px 6px}
#fgG{background:var(--g);border-radius:2px 6px 6px 2px}
.fgt{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--mut);white-space:nowrap}
.fgt b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.fgt span{font-weight:800;font-size:11.5px}
body.apo #bd{z-index:50}
body.apo #info{z-index:51}
body.hmo #bd{z-index:60}
body.hmo #info{z-index:61}
#hmbtn{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(11,19,23,.88);border:1px solid var(--line);display:grid;place-items:center;z-index:8;padding:0}
#hmbtn:active{background:#16262d}
#hmb{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:44}
#hm{font-family:ui-rounded,"SF Pro Rounded",Nunito,"Varela Round",system-ui,sans-serif;position:fixed;inset:0;margin:auto;width:min(98vw,600px);height:min(92dvh,800px);z-index:45;display:none;flex-direction:column;gap:8px;background:rgba(11,19,23,.98);border:1px solid var(--line);border-radius:18px;padding:14px 10px 12px;box-shadow:0 10px 40px rgba(0,0,0,.7)}
.hmh{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.hmh b{font-size:16px;font-weight:900;letter-spacing:-.2px}

<script>
(function(){
'use strict';
/* ====== PENGATURAN ====== */
const TOTAL = 3000;          // total saham teratas (3 halaman x 1000)
const PER_PAGE = 1000;      // 1 request = 1000 saham
const TV_URL = 'https://scanner.tradingview.com/america/scan';
const PROXIES = ['', 'https://corsproxy.io/?url=']; // '' = langsung; sisanya fallback jika diblok CORS
const NEUTRAL = 0.05;        // |perubahan| < 0.05% = ungu (netral)
const REFRESH_MS = 120000;   // auto refresh 2 menit

const COL = {g:[34,224,122], r:[255,77,77], p:[167,139,250]};
const tf = '24h';
let sortBy = 'mcap';
let rangeIdx = 0;
const DPR = Math.min(window.devicePixelRatio||1, 2.5);

const $ = id => document.getElementById(id);
const stage=$('stage'), cv=$('cv'), ctx=cv.getContext('2d');
const coins=[]; const byId=new Map(); let list=[]; let demo=false;
let totalCap=0;let W=0,H=0; const view={k:1,x:0,y:0}; let selected=null;

/* ====== FORMAT ====== */
const fmtP=p=>p==null?'-':p>=1?'$'+p.toLocaleString('en-US',{maximumFractionDigits:2}):'$'+Number(p).toFixed(4);
const fmtM=v=>v>=1e12?'$'+(v/1e12).toFixed(2)+'T':v>=1e9?'$'+(v/1e9).toFixed(1)+'B':v>=1e6?'$'+(v/1e6).toFixed(1)+'M':'$'+Math.round(v||0).toLocaleString('en-US');
const fmtC=v=>(v>0?'+':'')+v.toFixed(2)+'%';
const clsOfV=v=>v>NEUTRAL?'g':v<-NEUTRAL?'r':'p';
const chg=c=>c.ch[tf]||0;
const cls=c=>clsOfV(chg(c));
const css=k=>k==='g'?'up':k==='r'?'dn':'nu';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ====== DATA ====== */
function ingest(arr){
  arr.forEach(d=>{
    let c=byId.get(d.id);
    if(!c){c={id:d.id,x:null,y:null,r:0,tx:null,ty:null,tr:0,ph:Math.random()*6.28,fr:.6+Math.random()*.8,sp:null,imgEl:null,imgReq:0,vx:0,vy:0,drag:false,free:false};byId.set(d.id,c);coins.push(c);}
    c.sym=(d.symbol||'').toUpperCase(); c.name=d.name; c.img=d.image||''; c.rank=d.market_cap_rank||9999;
    c.price=d.current_price; c.mcap=d.market_cap||0; c.vol=d.total_volume||0;
    c.ch={'24h':d.price_change_percentage_24h_in_currency!=null?d.price_change_percentage_24h_in_currency:d.price_change_percentage_24h};
    for(const k in c.ch) if(c.ch[k]==null||!isFinite(c.ch[k])) c.ch[k]=0;
  });
  coins.sort((a,b)=>a.rank-b.rank);
}
const tvBody=p=>JSON.stringify({
  filter:[{left:'market_cap_basic',operation:'nempty'}],
  options:{lang:'en'},markets:['america'],symbols:{query:{types:[]},tickers:[]},
  columns:['name','description','close','change','volume','market_cap_basic','logoid'],
  sort:{sortBy:'market_cap_basic',sortOrder:'desc'},range:[(p-1)*PER_PAGE,p*PER_PAGE]
});
function mapTV(j,off){
  return j.data.map((r,i)=>{
    const d=r.d,tick=String(d[0]||r.s.split(':')[1]||'').toUpperCase();
    return {id:r.s,symbol:tick,name:d[1]||tick,
      image:d[6]?'https://s3-symbol-logo.tradingview.com/'+d[6]+'--big.svg':'',
      market_cap_rank:i+1+off,current_price:d[2],market_cap:d[5]||0,
      total_volume:(d[2]||0)*(d[4]||0),            // nilai transaksi (USD) = harga x volume lembar
      price_change_percentage_24h_in_currency:d[3]};
  });
}
async function fetchPage(p){
  for(let a=0;a<2;a++){
    for(const px of PROXIES){
      try{
        const u=px?px+encodeURIComponent(TV_URL):TV_URL;
        const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:tvBody(p),cache:'no-store'});
        if(!r.ok) throw 0;
        const j=await r.json();
        if(j&&Array.isArray(j.data)&&j.data.length) return mapTV(j,(p-1)*PER_PAGE);
      }catch(e){}
    }
    await sleep(1500);
  }
  return null;
}
let loading=false,retryT=null,svT=0;const pagesOk=new Set(),inflight=new Map();
function loadPage(p){
  if(inflight.has(p)) return inflight.get(p);
  const pr=(async()=>{
    const d=await fetchPage(p);
    if(!d) return false;
    const wasDemo=demo;
    if(demo){coins.length=0;byId.clear();list=[];demo=false;layCache={};}
    ingest(d);pagesOk.add(p);
    for(const k in layCache) if(k.indexOf((p-1)+':')===0) delete layCache[k];
    if(p===rangeIdx+1||wasDemo) relayout(); else precompute();
    queueAll();refreshUI();
    clearTimeout(svT);svT=setTimeout(saveCache,1000);
    return true;
  })();
  inflight.set(p,pr);
  const done=()=>inflight.delete(p);pr.then(done,done);
  return pr;
}
function ensurePage(p){if(!pagesOk.has(p)&&!inflight.has(p))loadPage(p);}
async function load(onlyMissing){
  if(loading) return; loading=true; clearTimeout(retryT);
  const pages=Math.ceil(TOTAL/PER_PAGE);
  if(!onlyMissing) pagesOk.clear();
  const todo=[];for(let p=1;p<=pages;p++) if(!pagesOk.has(p)) todo.push(p);
  await Promise.all(todo.map((p,i)=>sleep(i*200).then(()=>pagesOk.has(p)||loadPage(p))));
  loading=false;
  if(pagesOk.size<pages) retryT=setTimeout(()=>load(true),30000);
}
function saveCache(){try{localStorage.setItem('us_cache2',JSON.stringify({t:Date.now(),d:coins.map(c=>({id:c.id,symbol:c.sym,name:c.name,image:c.img,market_cap_rank:c.rank,current_price:c.price,market_cap:c.mcap,total_volume:c.vol,price_change_percentage_24h_in_currency:c.ch['24h']}))}));}catch(e){}}
function loadCache(){try{const j=JSON.parse(localStorage.getItem('us_cache2')||'null');if(j&&j.d&&j.d.length){ingest(j.d);return true;}}catch(e){}return false;}
function useDemo(){
  demo=true; const names=[['NVDA','NVIDIA'],['MSFT','Microsoft'],['AAPL','Apple'],['AMZN','Amazon'],['GOOGL','Alphabet'],['META','Meta Platforms'],['AVGO','Broadcom'],['TSLA','Tesla'],['COST','Costco'],['NFLX','Netflix']].map(t=>[t[0],t[0],t[1]]);
  let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  const gauss=()=>{let u=0;for(let i=0;i<6;i++)u+=rnd();return (u-3)/1.2;};
  const arr=[];
  for(let i=0;i<TOTAL;i++){
    const n=names[i]||['demo'+i,'S'+(i+1),'Saham '+(i+1)];
    const mc=4.5e12/Math.pow(i+1,1.35);
    const sc=1+Math.min(6,i/120);

let layCache={};let growFresh=0;
const ckey=()=>rangeIdx+':'+sortBy;
function rangeList(r){const lo=r*PER_PAGE,hi=lo+PER_PAGE;return coins.filter(c=>c.rank>lo&&c.rank<=hi);}
function curList(){return rangeList(rangeIdx);}
function layoutCompute(L,mode,maxIt,seed){
  const n=L.length,w=new Float32Array(n),lg=v=>Math.log10((v||0)+1);
  if(mode==='mcap'){
    const key=c=>lg(c.mcap);
    let mn=1e9,mx=-1e9;for(let i=0;i<n;i++){const v=key(L[i]);if(v<mn)mn=v;if(v>mx)mx=v;}
    for(let i=0;i<n;i++){const t=(key(L[i])-mn)/Math.max(.001,mx-mn);w[i]=.28+1.5*Math.pow(t,2.2);}
  }else if(mode==='trend'){
    const vs=[];for(let i=0;i<n;i++)vs.push(Math.max(0,L[i].vol||0));
    const sv=vs.filter(v=>v>0).sort((a,b)=>a-b);
    const cap=Math.max(1,sv[Math.floor(sv.length*.95)]||1);
    const top=sv.slice(Math.floor(sv.length*.95)),tk=Math.max(1,top.length);
    for(let i=0;i<n;i++){let v=Math.min(vs[i],cap)/cap;if(vs[i]>=cap){const r=top.length-1-top.indexOf(vs[i]);v=1+1.1*Math.pow(1-Math.min(r,tk)/tk,1.5);}w[i]=.28+1.25*Math.pow(v,.65);}
  }else{
    const sg=mode==='gain'?1:-1,val=c=>Math.max(0,chg(c)*sg),vals=[];
    for(let i=0;i<n;i++){const v=val(L[i]);if(v>0)vals.push(v);}
    vals.sort((a,b)=>a-b);
    const cap=Math.max(.5,vals[Math.floor(vals.length*.95)]||1);
    const top=vals.slice(Math.floor(vals.length*.95)),tk=Math.max(1,top.length),boost=mode==='loss';
    for(let i=0;i<n;i++){const x=val(L[i]);let v=Math.min(x,cap)/cap;if(boost&&x>=cap){const r=top.length-1-top.indexOf(x);v=1+2.1*Math.pow(1-Math.min(r,tk)/tk,1.4);}w[i]=.28+1.25*Math.pow(v,.65);}
  }
  let area=0;for(let i=0;i<n;i++)area+=Math.PI*w[i]*w[i];
  const s=Math.sqrt(.6*W*H/area),tx=new Float32Array(n),ty=new Float32Array(n),tr=new Float32Array(n);
  let rmax=0;
  for(let i=0;i<n;i++){
    const c=L[i];tr[i]=w[i]*s;if(tr[i]>rmax)rmax=tr[i];
    const sd=seed&&seed.n===n;
    tx[i]=clamp(c.tx!=null?c.tx:sd?seed.tx[i]:Math.random()*W,0,W-1);ty[i]=clamp(c.ty!=null?c.ty:sd?seed.ty[i]:Math.random()*H,0,H-1);
  }
  const cell=Math.max(8,rmax*2+1),cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  const head=new Int32Array(cols*rows),next=new Int32Array(n);
  for(let it=0;it<maxIt;it++){
    head.fill(-1);
    for(let i=0;i<n;i++){const g=((tx[i]/cell)|0)+((ty[i]/cell)|0)*cols;next[i]=head[g];head[g]=i;}
    let worst=0;
    for(let i=0;i<n;i++){
      const gx=(tx[i]/cell)|0,gy=(ty[i]/cell)|0,ri=tr[i]+.6;
      for(let oy=-1;oy<=1;oy++){const Y=gy+oy;if(Y<0||Y>=rows)continue;
      for(let ox=-1;ox<=1;ox++){const X=gx+ox;if(X<0||X>=cols)continue;
        for(let j=head[X+Y*cols];j>=0;j=next[j]){
          if(j<=i)continue;
          let dx=tx[j]-tx[i],dy=ty[j]-ty[i];const m=ri+tr[j],d2=dx*dx+dy*dy;
          if(d2<m*m){
            let d=Math.sqrt(d2);
            if(d<.001){dx=Math.random()-.5;dy=Math.random()-.5;d=Math.sqrt(dx*dx+dy*dy);}
            const o=m-d;if(o>worst)worst=o;
            const ra=tr[j]*tr[j]/(tr[i]*tr[i]+tr[j]*tr[j]),rb=1-ra,ux=dx/d,uy=dy/d;
            tx[i]-=ux*o*ra*.9;ty[i]-=uy*o*ra*.9;tx[j]+=ux*o*rb*.9;ty[j]+=uy*o*rb*.9;
          }
        }
      }}
    }
    for(let i=0;i<n;i++){tx[i]=clamp(tx[i],tr[i]+1,W-tr[i]-1);ty[i]=clamp(ty[i],tr[i]+1,H-tr[i]-1);}
    if(it>8&&worst<.4)break;
  }
  return {n,tx,ty,tr};
}

let pcGen=0;
const idle=f=>window.requestIdleCallback?requestIdleCallback(f,{timeout:600}):setTimeout(f,60);
function precompute(){

function mkSprite(c){
  const S=Math.round(clamp(c.tr*2*DPR*3,40,200)),T=S+4,m=T/2,R=S/2;
  const cn=document.createElement('canvas');cn.width=cn.height=T;const g=cn.getContext('2d');
  g.save();g.beginPath();g.arc(m,m,R,0,7);g.clip();
  if(c.imgEl){
    const iw=c.imgEl.naturalWidth||1,ih=c.imgEl.naturalHeight||1,sc=Math.max(2*R/iw,2*R/ih),w=iw*sc,h=ih*sc;
    g.fillStyle='#fff';g.fillRect(0,0,T,T);
    try{g.drawImage(c.imgEl,m-w/2,m-h/2,w,h);}catch(e){}
  }else{
    g.fillStyle='#e9eef0';g.fillRect(0,0,T,T);
    if(c.tr>=9){
      g.fillStyle='#0b1317';g.textAlign='center';g.textBaseline='middle';
      const t=c.sym.slice(0,4);g.font='800 '+Math.round(R*(t.length>3?.46:.58))+'px system-ui,sans-serif';g.fillText(t,m,m+R*.03);
    }
  }
  const sh=g.createRadialGradient(m-R*.35,m-R*.4,R*.05,m-R*.1,m-R*.1,R*1.15);
  sh.addColorStop(0,'rgba(255,255,255,.38)');sh.addColorStop(.25,'rgba(255,255,255,.1)');sh.addColorStop(.55,'rgba(0,0,0,0)');sh.addColorStop(.82,'rgba(0,0,0,.28)');sh.addColorStop(1,'rgba(0,0,0,.62)');
  g.fillStyle=sh;g.fillRect(0,0,T,T);
  const sx=m-R*.38,sy=m-R*.45,sp=g.createRadialGradient(sx,sy,0,sx,sy,R*.32);
  sp.addColorStop(0,'rgba(255,255,255,.75)');sp.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=sp;g.fillRect(0,0,T,T);

}

/* ====== LOGO LAZY LOAD ====== */
let imgQ=[];let imgAct=0;
function pump(){
  while(imgAct<64&&imgQ.length){
    const c=imgQ.shift();if(c.imgEl||c.imgFail||c.imgLoad)continue;
    imgAct++;c.imgLoad=1;
    const im=new Image();im.referrerPolicy='no-referrer';
    im.onload=()=>{c.imgEl=im;c.imgLoad=0;imgAct--;pump();};
    im.onerror=()=>{c.imgLoad=0;imgAct--;if(!c.imgTry){c.imgTry=1;imgQ.push(c);}else c.imgFail=true;pump();};
    im.src=c.img;
  }
}
function queueAll(){for(let i=0;i<coins.length;i++){const c=coins[i];if(!c.imgReq&&c.img){c.imgReq=1;imgQ.push(c);}}pump();}
function prioLogos(L){
  const need=L.filter(c=>c.img&&!c.imgEl&&!c.imgFail&&!c.imgLoad).sort((a,b)=>b.tr-a.tr);
  if(!need.length)return;
  const set=new Set(need);imgQ=imgQ.filter(c=>!set.has(c));
  need.forEach(c=>{c.imgReq=1;});imgQ=need.concat(imgQ);pump();
}

let bud=0,awake=0,noCol=0,hl=null;
function kick(){awake=300;noCol=16;for(let i=0;i<coins.length;i++)coins[i].free=false;}
const SK=.45,SD=.62;let gHead=new Int32Array(0),gNext=new Int32Array(0);
function physics(){
  const n=list.length;if(!n)return 0;
  let rmax=0;for(let i=0;i<n;i++){const r=list[i].r;if(r>rmax)rmax=r;}
  const cell=Math.max(16,rmax*2),cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  if(gHead.length<cols*rows)gHead=new Int32Array(cols*rows);
  if(gNext.length<n)gNext=new Int32Array(n);
  gHead.fill(-1,0,cols*rows);
  const col=noCol<=0;if(!col)noCol--;
  let mv=0;
  for(let i=0;i<n;i++){
    const c=list[i];
    if(!c.drag){
      if(c.free){c.vx*=.985;c.vy*=.985;}
      else if(c.ret){c.vx=(c.vx+(c.tx-c.x)*.1)*.84;c.vy=(c.vy+(c.ty-c.y)*.1)*.84;}   /* kembali halus ke posisi asal */
      else{c.vx=(c.vx+(c.tx-c.x)*SK)*SD;c.vy=(c.vy+(c.ty-c.y)*SK)*SD;}
      c.x+=c.vx;c.y+=c.vy;
    }
    c.r+=(c.tr-c.r)*.55;
    const r=c.r;
    if(c.x<r){c.x=r;if(!c.drag)c.vx=Math.abs(c.vx)*.8;}else if(c.x>W-r){c.x=W-r;if(!c.drag)c.vx=-Math.abs(c.vx)*.8;}
    if(c.y<r){c.y=r;if(!c.drag)c.vy=Math.abs(c.vy)*.8;}else if(c.y>H-r){c.y=H-r;if(!c.drag)c.vy=-Math.abs(c.vy)*.8;}
    const sp=Math.abs(c.vx)+Math.abs(c.vy);
    if(c.free&&sp<.3){c.free=false;c.tx=c.x;c.ty=c.y;}
    if(c.ret&&sp<.25&&Math.abs(c.tx-c.x)+Math.abs(c.ty-c.y)<.6)c.ret=false;
    const e=Math.max(sp,Math.abs(c.tr-c.r)*.5);if(e>mv)mv=e;
    if(r>=.5){const gx=Math.min(cols-1,Math.max(0,Math.floor(c.x/cell))),gy=Math.min(rows-1,Math.max(0,Math.floor(c.y/cell))),g=gx+gy*cols;gNext[i]=gHead[g];gHead[g]=i;}
  }
  if(!col)return mv;
  for(let i=0;i<n;i++){
    const a=list[i];if(a.r<.5)continue;
    const gx=Math.min(cols-1,Math.max(0,Math.floor(a.x/cell))),gy=Math.min(rows-1,Math.max(0,Math.floor(a.y/cell)));
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
      const X=gx+ox,Y=gy+oy;if(X<0||Y<0||X>=cols||Y>=rows)continue;
      for(let j=gHead[X+Y*cols];j>=0;j=gNext[j]){
        if(j<=i)continue;const b=list[j];
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const m=a.r+b.r;
        if(d>=m)continue;
        if(d<.001){dx=.01;dy=0;d=.01;}
        const nx=dx/d,ny=dy/d,o=(m-d)*.8,ia=a.drag?0:1/(a.r*a.r),ib=b.drag?0:1/(b.r*b.r),sm=ia+ib;
        if(sm===0)continue;
        a.x-=nx*o*ia/sm;a.y-=ny*o*ia/sm;b.x+=nx*o*ib/sm;b.y+=ny*o*ib/sm;
        const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(vn<0){const J=-1.7*vn/sm;a.vx-=J*ia*nx;a.vy-=J*ia*ny;b.vx+=J*ib*nx;b.vy+=J*ib*ny;}
      }
    }
  }
  return mv;
}
function frame(t){
  requestAnimationFrame(frame);

  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
  const vx0=-view.x/view.k,vy0=-view.y/view.k,vx1=vx0+W/view.k,vy1=vy0+H/view.k;
  bud=120;
  for(let i=0;i<list.length;i++){
    const c=list[i];
    if(!c.imgReq&&c.img){c.imgReq=1;imgQ.push(c);}
    if(c.r<.25) continue;
    const pad=c.r*1.9;
    if(c.x+pad<vx0||c.x-pad>vx1||c.y+pad<vy0||c.y-pad>vy1) continue;
    if(!(c.imgEl||c.imgFail||!c.img)) continue;
    if(bud>0&&(!c.sp||((c.spImg!==!!c.imgEl||c.tr>c.spR*1.35)&&Math.abs(c.tr-c.r)<c.tr*.12+.3))){mkSprite(c);bud--;}

  }
  if(selected){

  }
}

function fakePts(c){
  let h=2166136261;const id=String(c.id);
  for(let i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619);}
  const rnd=()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
  const ch=clamp(c.ch['24h']||0,-40,40)/100,n=30,amp=Math.max(.012,Math.abs(ch)*.55);
  const start=1/(1+ch),w=[0];
  for(let i=1;i<n;i++)w.push(w[i-1]+(rnd()-.5));
  const pts=[];
  for(let i=0;i<n;i++){
    const t=i/(n-1),bridge=w[i]-w[n-1]*t;       // jembatan acak: awal & akhir tetap
    pts.push(start+(1-start)*t+bridge*amp*.9);
  }

}

let hmList=[];const HM_POW=1.25;
const HM_GRAY=[43,51,56],HM_UP=[[47,191,104],[8,72,35]],HM_DN=[[229,83,75],[105,12,14]];
const hmMix=(a,b,t)=>[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t));
function hmRGB(v){
  const a=Math.abs(v);
  if(a<=.15)return HM_GRAY;
  const P=v>0?HM_UP:HM_DN;
  if(a<=1.2)return hmMix(HM_GRAY,P[0],(a-.15)/1.05);      /* abu-abu gelap -> warna terang */
  return hmMix(P[0],P[1],Math.min(1,(a-1.2)/3.8));         /* terang -> tua (merah tua / hijau tua) */
}
const hmCss=r=>'rgb('+r[0]+','+r[1]+','+r[2]+')';
const hmTxt=r=>(r[0]*.299+r[1]*.587+r[2]*.114)>150?'#04140a':'#fff';
function treemap(items,W0,H0){
  const tot=items.reduce((a,t)=>a+t.v,0),k=W0*H0/tot,arr=items.map(t=>({c:t.c,a:t.v*k})),out=[];
  let x=0,y=0,w=W0,h=H0,i=0;
  const worst=(r,s,side)=>{let mx=0,mn=1e18;for(const t of r){if(t.a>mx)mx=t.a;if(t.a<mn)mn=t.a;}return Math.max(side*side*mx/(s*s),s*s/(side*side*mn));};
  while(i<arr.length){
    const side=Math.min(w,h);let row=[arr[i]],s=arr[i].a,j=i+1;
    while(j<arr.length){const t=arr[j],s2=s+t.a;if(worst(row.concat(t),s2,side)<=worst(row,s,side)){row.push(t);s=s2;j++;}else break;}
    if(w>=h){const cw=s/h;let yy=y;for(const t of row){const th=t.a/cw;out.push({c:t.c,x:x,y:yy,w:cw,h:th});yy+=th;}x+=cw;w-=cw;}
    else{const rh=s/w;let xx=x;for(const t of row){const tw=t.a/rh;out.push({c:t.c,x:xx,y:y,w:tw,h:rh});xx+=tw;}y+=rh;h-=rh;}
    i=j;
  }
  return out;
}

  const T=treemap(hmList.map(c=>({c:c,v:Math.pow(c.mcap,HM_POW)})),w,h);   /* luas kotak mengikuti market cap; HM_POW>1 = besar makin besar, kecil makin kecil */
  const lgo=(c,L)=>c.img?'<img class="hl" alt="" referrerpolicy="no-referrer" decoding="async" src="'+esc(c.img)+'" style="width:'+L.toFixed(0)+'px;height:'+L.toFixed(0)+'px">':'';
  const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
  let html='';
  T.forEach((t,i)=>{
    const c=t.c,v=chg(c),rgb=hmRGB(v),mn=Math.min(t.w,t.h),len=c.sym.length;
    let inner='';
    if(t.w>=70&&t.h>=60){                                    /* sangat besar: logo besar + simbol + % */

    }else if(t.w>=44&&t.h>=40){                              /* besar: logo + simbol + % */
      const L=clampN(mn*.32,14,30),fs=clampN(Math.min(mn/4.2,t.w/(len*.75)),9,16);
      inner=lgo(c,L)+'<b style="font-size:'+fs.toFixed(1)+'px">'+esc(c.sym)+'</b>';
      if(t.h>=L+fs*3)inner+='<i style="font-size:'+Math.max(8,fs*.8).toFixed(1)+'px">'+(v>0?'+':'')+v.toFixed(2)+'%</i>';
    }else if(t.w>=28&&t.h>=26){                              /* sedang: logo + simbol kecil */
      const L=clampN(mn*.36,9,16),fs=clampN(t.w/(len*.78),6.5,11);
      inner=lgo(c,L);
      if(t.h>=L+fs*1.7||!c.img)inner+='<b style="font-size:'+fs.toFixed(1)+'px">'+esc(c.sym)+'</b>';
    }else if(mn>=16){                                        /* kecil: logo saja */
      if(c.img)inner=lgo(c,Math.min(22,mn*.7));
    }                                                        /* terkecil: kotak polos tanpa logo/teks */
    const g=mn>=14?1:mn>=6?.6:.3,rad=mn>=44?5:mn>=14?3:mn>=6?1.5:.5;
    html+='<div class="ht" data-i="'+i+'" style="left:'+(t.x+g/2).toFixed(1)+'px;top:'+(t.y+g/2).toFixed(1)+'px;width:'+Math.max(.5,t.w-g).toFixed(1)+'px;height:'+Math.max(.5,t.h-g).toFixed(1)+'px;border-radius:'+rad+'px;background:'+hmCss(rgb)+';color:'+hmTxt(rgb)+'">'+inner+'</div>';
  });
  box.innerHTML=html;
}
(function(){
  const lg=$('hmlg'),st=[-5,-2.5,-1,0,1,2.5,5];
  lg.innerHTML=st.map(v=>{const r=hmRGB(v);return '<span style="background:'+hmCss(r)+';color:'+hmTxt(r)+'">'+(v>0?'+':'')+v+'%</span>';}).join('');
})();
function openHM(){document.body.classList.add('hmo');$('hmb').style.display='block';$('hm').style.display='flex';renderHM();}
function closeHM(){hideInfo();document.body.classList.remove('hmo');$('hmb').style.display='none';$('hm').style.display='none';}
$('hmbtn').onclick=e=>{e.stopPropagation();openHM();};
$('hmx').onclick=closeHM;
$('hmc').addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.style.visibility='hidden';},true);
$('hmb').addEventListener('click',closeHM);
$('hmc').addEventListener('click',e=>{const t=e.target.closest('.ht');if(!t)return;const c=hmList[+t.dataset.i];if(c)showInfo(c);});
let hrt;window.addEventListener('resize',()=>{clearTimeout(hrt);hrt=setTimeout(()=>{if(document.body.classList.contains('hmo'))renderHM();},150);});

/* ====== RESIZE ====== */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  const first=!W;
  if(w===W&&h===H)return;
  if(W&&H){coins.forEach(c=>{if(c.x!=null){c.x*=w/W;c.y*=h/H;c.tx*=w/W;c.ty*=h/H;}});}
  W=w;H=h;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  view.k=1;view.x=view.y=0;clampView();
  coins.forEach(c=>c.sp=null);
  layCache={};
  relayout();
}
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(resize,120);}).observe(stage);

/* ====== START ====== */
resize();
if(loadCache()){demo=false;relayout();refreshUI();queueAll();}else{setTimeout(()=>{if(!coins.length)useDemo();},12000);}
requestAnimationFrame(frame);
load();
setInterval(()=>{if(!document.hidden&&!demo&&pagesOk.size>=Math.ceil(TOTAL/PER_PAGE))load();},REFRESH_MS);
})();
</script>
